services:
  mongodb:
    image: mongo:7.0@sha256:9896df581dfd0718b7abe112f4c37598d0986c54060e4ec1384997e6503c8c71
    container_name: sms-mongodb
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MONGO_HOST_PORT:-27017}:27017'
    environment:
      MONGO_INITDB_DATABASE: sms
      # Authentication is enforced as soon as a root user exists. These only take effect when the
      # data volume is first created; for an existing volume create the user manually (see README).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    networks:
      - sms-network
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ping:1})"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine@sha256:2f66de68111e64c3927859f158f8e666066dae2b97d9f82770a6f37a5aa1c335
    container_name: sms-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - sms-network
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sms-backend
    restart: unless-stopped
    expose:
      - '5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/sms?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://localhost}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - sms-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sms-frontend
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - TLS_COMMON_NAME=${TLS_COMMON_NAME:-localhost}
    volumes:
      # Put fullchain.pem + privkey.pem here for a real hostname; otherwise a
      # self-signed pair is generated into this folder on first start.
      - ./certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sms-network

volumes:
  mongo_data:
  redis_data:
  backend_uploads:
  backend_logs:

networks:
  sms-network:
    driver: bridge
