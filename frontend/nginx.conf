# Per-IP request cap on the auth endpoints (a whole school may share one NAT address, so keep it generous).
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=120r/m;

# HTTP: only used to redirect to HTTPS. The refresh-token cookie is `Secure` in
# production, so browsers drop it on plain HTTP and every session would expire.
server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    # Mount real certificates at ./certs (see docker-compose.yml); if none are present the
    # container generates a self-signed pair on start (docker/10-generate-self-signed-cert.sh).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Must exceed the backend limits (10 MB JSON / MAX_FILE_SIZE_MB uploads); nginx's 1 MB
    # default rejected student photos (sent as base64) and Excel imports with 413.
    client_max_body_size 12m;

    # Slow-client protection (SSE and long API calls are governed by proxy_read_timeout below)
    client_header_timeout 30s;
    client_body_timeout 60s;
    send_timeout 120s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets with caching (re-include the headers: a local add_header disables inheritance)
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Auth endpoints: same proxy settings as /api/ plus a request-rate cap
    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:5000/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Reverse Proxy
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static File Uploads Reverse Proxy
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
