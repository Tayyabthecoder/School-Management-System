name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Least privilege for the default GITHUB_TOKEN; cancel superseded runs on the same ref.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests, Coverage & Audit
    runs-on: ubuntu-latest
    # The *.integration.test.js suites run the API against a real MongoDB
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Tests with Coverage Gate
        working-directory: ./backend
        run: npm run test:coverage -- --ci

      - name: Audit Production Dependencies (high and critical)
        working-directory: ./backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend Lint, Tests, Build & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build

      - name: Check the production bundle has no demo credentials
        working-directory: ./frontend
        run: |
          if grep -rqE "Admin@1234|Staff@1234" dist; then
            echo "Demo credentials found in dist/" >&2
            exit 1
          fi

      - name: Audit Production Dependencies (high and critical)
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker Build & Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t sms-backend:ci backend

      - name: Build frontend image
        run: docker build -t sms-frontend:ci frontend

      # Informational for now (exit-code 0): surfaces fixable HIGH/CRITICAL findings in the
      # base images and dependencies without blocking merges. Set exit-code to 1 to enforce.
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sms-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sms-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
