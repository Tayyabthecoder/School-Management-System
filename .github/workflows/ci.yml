name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Tests, Coverage & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Tests with Coverage Gate
        working-directory: ./backend
        run: npm run test:coverage -- --ci

      - name: Audit Production Dependencies (high and critical)
        working-directory: ./backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend Lint, Tests, Build & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build

      - name: Check the production bundle has no demo credentials
        working-directory: ./frontend
        run: |
          if grep -rqE "Admin@1234|Staff@1234" dist; then
            echo "Demo credentials found in dist/" >&2
            exit 1
          fi

      - name: Audit Production Dependencies (high and critical)
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high
